[project]
name = "fpl-manager"
version = "0.1.0"
description = "Build and maintain a Fantasy Premier League squad"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "pulp>=2.7,<4.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
]

[project.scripts]
fpl-manager = "fpl_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl_manager"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits the live FPL API, deselected by default",
]
